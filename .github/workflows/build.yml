# build.yml 定时多架构打包发布 ghcr.io + amd64 离线 tar.gz artifact。
# 解决 issue #21「建议打包现成 docker 镜像」：NAS/离线环境拉不到 ghcr 时用 artifact。
# 参考 /tmp/wb2api-build，适配本仓库（workflow 就住在仓库里，无需双 checkout 覆盖 Dockerfile）。
# v1.13.0 起：打 v* tag 额外构建多平台主程序二进制 + 任务工具 exe 并上传 release assets
# （此前全靠本地手动构建上传，v1.13.0 漏传致 release 空资产，故固化进 CI）。
name: Build & Publish

on:
  schedule:
    # 每天北京时间 12:23 = UTC 04:23。
    # 不用整点 04:00：GitHub schedule 在整点高峰排队严重（实测连续三天迟到 5h+，
    # 2026-09-17 的 04:00 排队被静默丢弃、整天未跑），错峰 23 分降低排队延迟与丢弃率。
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    tags: ['v*'] # 打 tag 也触发发布

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create config.json for build
        run: cp config.example.json config.json

      # 前端构建（v1.2.0 三段构建）：Node 版本钉死 22（与 Dockerfile node:22-alpine 一致，
      # 避免本地/CI 漂移——设计文档 §10 风险 5）。Dockerfile 的 frontend 段自行构建，
      # 此步只为 GHA 缓存预热与早期失败暴露（npm ci/build 快速报错优于 20 分钟 docker build 后失败）。
      - name: Set up Node 22 (panel frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build panel frontend (smoke)
        run: |
          npm ci --prefix web
          npm run build:export --prefix web

      # setup-qemu 必须在 setup-buildx 之前：buildx 多架构依赖 QEMU 跨平台模拟。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr 镜像名必须全小写：github.repository 含大写（Sliverkiss/...），需转小写
      - name: Compute image name (lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # 打 tag 时把版本注入镜像内二进制（面板「关于/版本检查」显示真实版本）
      - name: Compute version for build-arg
        id: ver
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build & push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 额外导出 amd64 离线 tar.gz：NAS 拉不到 ghcr 时用 artifact 部署。
      - name: Export offline tarball (amd64)
        run: |
          docker buildx build --platform linux/amd64 --file Dockerfile \
            --tag wb2api:offline --output type=docker,dest=wb2api-amd64.tar .
          gzip -f wb2api-amd64.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wb2api-amd64
          path: wb2api-amd64.tar.gz
          if-no-files-found: error

  # 打 v* tag 时构建 release 二进制资产（v1.13.0 起固化，替代本地手动上传）。
  # 资产清单与 v1.12.0 对齐：主程序四平台（-tags embed_panel 内嵌面板前端）+
  # win zip / linux tar.gz + 5 个任务工具 exe + sha256sums。定时/手动跑不触发本 job。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 release 与上传 assets 需要 write（顶层只给了 packages:write）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26' # 钉 1.26 与 Dockerfile golang:1.26-alpine 一致（go.mod 1.22.5 仅是语言最低版）

      - name: Build binaries
        run: |
          set -euxo pipefail
          V="${GITHUB_REF_NAME}"
          mkdir dist
          # 主程序：embed_panel 内嵌前端（dist 产物已提交，无需 Node 构建）。
          # appVersion 必须注入：面板「开发版」显示与 /api/system/check-update 的
          # current 都取这个值，未注入会一直显示 dev 且版本比对失真。
          for p in windows/amd64 linux/amd64 linux/arm64 darwin/arm64; do
            os="${p%/*}"; arch="${p#*/}"
            # go build -o 显式指定文件名时不会自动补 .exe，windows 目标必须显式带上
            # （否则 zip / sha256sum 按 *.exe 找不到文件，release job 首跑即挂）
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -tags embed_panel -trimpath \
              -ldflags="-s -w -X workbuddy2api/internal/server.appVersion=${V}" \
              -o "dist/wb2api-${V}-${os}-${arch}${ext}" ./cmd/server
          done
          # 打包：win=zip（内单 exe）、linux=裸二进制 tar.gz，与 v1.12.0 布局一致
          (cd dist && zip -q "wb2api-${V}-windows-amd64.zip" "wb2api-${V}-windows-amd64.exe")
          (cd dist && tar -czf "wb2api-${V}-linux-amd64.tar.gz" "wb2api-${V}-linux-amd64")
          # 任务工具 exe（清单对齐 v1.12.0：acct/stats 不发布）
          for t in activity credit login signin trial; do
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
              -ldflags="-s -w -X workbuddy2api/internal/server.appVersion=${V}" \
              -o "dist/${t}-windows-amd64.exe" "./cmd/${t}"
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum activity-windows-amd64.exe credit-windows-amd64.exe \
            login-windows-amd64.exe signin-windows-amd64.exe trial-windows-amd64.exe \
            "wb2api-${GITHUB_REF_NAME}-darwin-arm64" "wb2api-${GITHUB_REF_NAME}-linux-amd64" \
            "wb2api-${GITHUB_REF_NAME}-linux-amd64.tar.gz" "wb2api-${GITHUB_REF_NAME}-linux-arm64" \
            "wb2api-${GITHUB_REF_NAME}-windows-amd64.exe" "wb2api-${GITHUB_REF_NAME}-windows-amd64.zip" \
            > "sha256sums-${GITHUB_REF_NAME}.txt"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # tag 先于 release 建好时兜底自动建（正式发布语录仍建议提前手写好再推 tag）
          gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --generate-notes --repo "$GITHUB_REPOSITORY"
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "$GITHUB_REPOSITORY"
