# 打 tag 时自动构建前端、打包产物并创建 GitHub Release。
#
# 用法：推送形如 v1.0.0 的 tag 即可
#   git tag v1.0.0 && git push origin v1.0.0
#
# 产物为可直接部署的压缩包（含 server/ 与已构建的 web/out/）。
name: Release

on:
  push:
    tags:
      - 'v*'
  # 允许手动触发（用于补发某个已有 tag 的产物）
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 tag（如 v1.0.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 解析版本号
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.tag }}
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建前端静态导出
        working-directory: web
        run: |
          npm ci
          npm run build:export

      - name: 校验构建产物
        run: |
          test -f web/out/index.html || { echo "构建失败：缺少 web/out/index.html"; exit 1; }
          echo "构建产物大小：$(du -sh web/out | cut -f1)"

      - name: 后端语法与导入自检
        run: |
          python3 -m compileall -q server
          echo "后端语法检查通过"

      - name: 组装发布目录
        id: pack
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          STAGE="workbuddy-manager-${TAG}"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -r server "$STAGE/"
          mkdir -p "$STAGE/web" && cp -r web/out "$STAGE/web/"
          cp -r deploy "$STAGE/"
          cp .env.example README.md CHANGELOG.md LICENSE "$STAGE/"
          # 不含运行时数据与凭据
          find "$STAGE" -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          echo "stage=$STAGE" >> $GITHUB_OUTPUT
          tar czf "${STAGE}.tar.gz" "$STAGE"
          zip -qr "${STAGE}.zip" "$STAGE"
          ls -lh "${STAGE}.tar.gz" "${STAGE}.zip"
          echo "打包完成"

      - name: 生成发布说明
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          # 优先取 CHANGELOG 中该版本的段落；取不到则退回提交摘要
          python3 - "$TAG" > RELEASE_NOTES.md <<'PY'
          import re, sys, subprocess
          tag = sys.argv[1]
          version = tag.lstrip('v')
          try:
              text = open('CHANGELOG.md', encoding='utf-8').read()
          except FileNotFoundError:
              text = ''
          # 匹配 "## [1.0.0] - 2026-09-11" 到下一个 "## [" 之间
          pattern = re.compile(
              r'^##+\s*\[' + re.escape(version) + r'\].*?$(.*?)(?=^##+\s*\[|\Z)',
              re.S | re.M,
          )
          m = pattern.search(text)
          if m and m.group(1).strip():
              print(m.group(1).strip())
          else:
              print('## 变更\n')
              log = subprocess.run(
                  ['git', 'log', '--pretty=format:- %s', '-n', '40', tag],
                  capture_output=True, text=True,
              ).stdout.strip()
              print(log or '详见提交历史。')
          PY
          echo "--- 发布说明预览 ---"
          head -20 RELEASE_NOTES.md

      - name: 创建 Release 并上传产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          STAGE="${{ steps.pack.outputs.stage }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，改为上传/覆盖产物"
            gh release upload "$TAG" "${STAGE}.tar.gz" "${STAGE}.zip" --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md \
              "${STAGE}.tar.gz" "${STAGE}.zip"
          fi

      - name: 部署说明
        run: |
          cat <<'EOF' >> $GITHUB_STEP_SUMMARY
          ## 发布完成

          资产：
          - `${{ steps.pack.outputs.stage }}.tar.gz`
          - `${{ steps.pack.outputs.stage }}.zip`

          部署方式（解压后）：
          ```bash
          tar xzf ${{ steps.pack.outputs.stage }}.tar.gz
          cd ${{ steps.pack.outputs.stage }}
          sudo bash deploy/install.sh
          ```
          EOF
